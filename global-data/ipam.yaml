---
# IPAM content: written to NetBox by network/10-ipam; VLANs marked `sdn` become Proxmox SDN VNets
# in each domain's 10-proxmox-base (zone = VLAN group); active prefixes give the masks of the
# addresses edge/35-netbox-addresses registers.
# Every key is required.
# roles: IP range role slug => name, description and mark_populated (true: NetBox treats the whole
#   range as used and never offers its addresses as available).
# vlan_groups: group => VLAN name => description, vid, sdn (true: create a Proxmox VNet; group and
#   VLAN names must then be 2-8 alphanumeric characters), prefix (IPv4 CIDR) and ranges.
# prefixes: prefixes outside any VLAN => description, status and ranges.
# ranges: role slug => {start, end} addresses without mask, inside the prefix.
roles:
  dhcp:
    name: DHCP
    description: Pools Kea leases from; network/20-kea reads this slug
    mark_populated: true
  static:
    name: Static
    description: Static addresses OpenTofu allocates from
    mark_populated: false

vlan_groups:
  Mgmt:
    MgmtNet:
      description: Management LAN
      vid: 1
      sdn: false
      prefix: 10.88.0.0/24
      ranges:
        dhcp: { start: 10.88.0.101, end: 10.88.0.120 }
        static: { start: 10.88.0.150, end: 10.88.0.200 }
  Lab:
    IoTSecNet:
      description: IoT without Internet Access
      vid: 13
      sdn: false
      prefix: 10.88.13.0/24
      ranges:
        dhcp: { start: 10.88.13.50, end: 10.88.13.200 }
    IoTNet:
      description: IoT with Internet Access
      vid: 15
      sdn: true
      prefix: 10.88.15.0/24
      ranges:
        dhcp: { start: 10.88.15.5, end: 10.88.15.14 }
        static: { start: 10.88.15.100, end: 10.88.15.200 }
    LabNet:
      description: Default VLAN for all VMs
      vid: 16
      sdn: true
      prefix: 10.88.16.0/24
      ranges:
        dhcp: { start: 10.88.16.170, end: 10.88.16.200 }
        static: { start: 10.88.16.100, end: 10.88.16.150 }
  VPN:
    IndiaNet:
      description: The only egress is via the VPN
      vid: 200
      sdn: true
      prefix: 10.88.200.0/24
      ranges:
        dhcp: { start: 10.88.200.101, end: 10.88.200.250 }
        static: { start: 10.88.200.50, end: 10.88.200.100 }
  Home:
    Wifi:
      description: For trusted personal devices
      vid: 14
      sdn: false
      prefix: 10.88.14.0/24
      ranges:
        dhcp: { start: 10.88.14.2, end: 10.88.14.254 }
  Work:
    WorkNet:
      description: For work devices
      vid: 100
      sdn: false
      prefix: 10.88.100.0/29
      ranges:
        dhcp: { start: 10.88.100.2, end: 10.88.100.6 }

prefixes:
  10.88.0.0/16:
    description: Lab data center
    status: container
    ranges: {}
