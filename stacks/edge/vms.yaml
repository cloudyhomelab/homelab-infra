---
# Every VM of the domain. Read by 15-image-catalog, which fetches the images named here, by the VM
# stacks, which pick theirs by key, by 17-storage, and by
# 35-netbox-addresses, which writes the static addresses to NetBox.
# defaults: config fields every VM gets unless it sets its own.
# vms: key => image (catalog key <os>/<type>), network (VLAN of global-data/ipam.yaml, resolved to a bridge
#   by 10-proxmox-base) plus the module's other config fields; name defaults to the key.
defaults:
  node: pve-lab-1

vms:
  dns-primary:
    image: debian/debian-dns-primary
    name: ns1
    network: DNSNet
    dhcp: false
    ip4_address_cidr: 10.88.53.11/28
    gateway: 10.88.53.1
    dns_addresses: [10.88.53.1]
    create_dns_record: false

  resolver1:
    image: debian/debian-dns-resolver
    network: DNSNet
    dhcp: false
    ip4_address_cidr: 10.88.53.3/28
    gateway: 10.88.53.1
    dns_addresses: [10.88.53.1]
    create_dns_record: true

  netbox:
    image: debian/debian-netbox
    network: LabNet
    dhcp: false
    ip4_address_cidr: 10.88.16.10/24
    gateway: 10.88.16.1
    dns_addresses: [10.88.16.1]
