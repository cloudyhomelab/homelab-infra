---
# image: index key <os>/<type>; image_version: its pinned BUILD_VERSION; network: VLAN of global-data/ipam.yaml.
# create_vm: false keeps the storage and drops the VM and its address.
defaults:
  node: pve-lab-1
  create_vm: true

workloads:
  dns-primary:
    image: debian/debian-dns-primary
    image_version: "20261122-1754"
    name: ns1
    network: DNSNet
    dhcp: false
    ip4_address_cidr: 10.88.53.11/28
    gateway: 10.88.53.1
    dns_addresses: [10.88.53.1]
    create_dns_record: false

  resolver1:
    image: debian/debian-dns-resolver
    image_version: "20261122-1624"
    network: DNSNet
    dhcp: false
    ip4_address_cidr: 10.88.53.3/28
    gateway: 10.88.53.1
    dns_addresses: [10.88.53.1]
    create_dns_record: true

  netbox:
    image: debian/debian-netbox
    image_version: "20261122-1626"
    network: LabNet
    dhcp: false
    ip4_address_cidr: 10.88.16.10/24
    gateway: 10.88.16.1
    dns_addresses: [10.88.16.1]
