---
# Every VM of the domain. Read by 15-image-catalog, which fetches the images named here, by
# 16-vm-addresses, by the VM stacks, which pick theirs by key, and by
# 17-storage.
# defaults: config fields every VM gets unless it sets its own.
# vms: key => image (catalog key <os>/<type>), network (VLAN of global-data/ipam.yaml, resolved to a bridge
#   by 10-proxmox-base) plus the module's other config fields; name defaults to the key.
# Unless dhcp is true, 16-vm-addresses registers the VM's address in NetBox and, unless create_dns_record
# is false, in DNS: ip4_address_cidr pins it, without it NetBox allocates one from the VLAN's static range;
# gateway and DNS servers come from NetBox.
defaults:
  node: pve-infra-1
  dhcp: false

vms:
  controlplane:
    image: debian/debian-controlplane
    network: MgmtNet
    cpu: host
    cores: 2
    memory: 6144
    disk_size: 50

  runner:
    image: debian/debian-runner
    network: LabNet

  observability:
    image: debian/debian-observability
    network: LabNet
    cores: 2
    memory: 4096
    disk_size: 50

  mgmt-ctl:
    image: debian/debian-management-ingress-control
    network: MgmtNet

  lab-ctl:
    image: debian/debian-lab-ingress-control
    network: LabNet

  iot-ctl:
    image: debian/debian-iot-ingress-control
    network: IoTNet

  edge-ctl:
    image: debian/debian-edge
    network: MgmtNet
    ip4_address_cidr: 10.88.0.211/24

  arr-stack:
    image: debian/debian-arr-stack
    network: LabNet
    cores: 2
    memory: 4096
    disk_size: 20

  ns2:
    image: debian/debian-dns-secondary
    network: LabNet
    ip4_address_cidr: 10.88.16.12/24
    create_dns_record: false

  resolver2:
    image: debian/debian-dns-resolver
    network: DNSNet
    ip4_address_cidr: 10.88.53.4/28

  homeassistant:
    image: debian/debian-homeassistant
    network: IoTNet
