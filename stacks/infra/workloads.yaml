---
# image: index key <os>/<type>; image_version: its pinned BUILD_VERSION; network: VLAN of global-data/ipam.yaml.
# create_vm: false keeps the storage and drops the VM and its address.
# Without ip4_address_cidr, a static VM gets an address from its VLAN's static range in NetBox.
defaults:
  node: pve-infra-1
  dhcp: false
  create_vm: true

workloads:
  controlplane:
    image: debian/debian-controlplane
    image_version: "20261122-1624"
    network: MgmtNet
    cpu: host
    cores: 2
    memory: 6144
    disk_size: 50

  runner:
    image: debian/debian-runner
    image_version: "20261122-1627"
    network: LabNet

  observability:
    image: debian/debian-observability
    image_version: "20261122-1626"
    network: LabNet
    cores: 2
    memory: 4096
    disk_size: 50

  mgmt-ctl:
    image: debian/debian-management-ingress-control
    image_version: "20261122-1625"
    network: MgmtNet

  lab-ctl:
    image: debian/debian-lab-ingress-control
    image_version: "20261122-1625"
    network: LabNet

  iot-ctl:
    image: debian/debian-iot-ingress-control
    image_version: "20261122-1624"
    network: IoTNet

  edge-ctl:
    image: debian/debian-edge
    image_version: "20261122-1624"
    network: MgmtNet
    ip4_address_cidr: 10.88.0.211/24

  arr-stack:
    image: debian/debian-arr-stack
    image_version: "20261122-1624"
    network: LabNet
    cores: 2
    memory: 4096
    disk_size: 20

  ns2:
    image: debian/debian-dns-secondary
    image_version: "20261122-1754"
    network: DNSNet
    ip4_address_cidr: 10.88.53.12/28
    create_dns_record: false

  resolver2:
    image: debian/debian-dns-resolver
    image_version: "20261122-1624"
    network: DNSNet
    ip4_address_cidr: 10.88.53.4/28

  homeassistant:
    image: debian/debian-homeassistant
    image_version: "20261122-1624"
    network: IoTNet

  media:
    image: debian/debian-media
    image_version: "20261122-1626"
    network: LabNet
    cores: 4
    memory: 4096
